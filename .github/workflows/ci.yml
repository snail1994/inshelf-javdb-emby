name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build userscript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify dist is committed and up to date
        run: git diff --exit-code -- dist/
